        </p>
        <div style="margin-top: 2rem; width: 50px; height: 3.5px; background: rgba(212, 175, 55, 0.2); border-radius: 4px; overflow: hidden; position: relative;">
          <div style="position: absolute; top: 0; bottom: 0; width: 45%; background: linear-gradient(90deg, #d4af37, #fef08a); border-radius: 4px; animation: splashPulse 1.2s ease-in-out infinite alternate;"></div>
        </div>
      </div>
      <style>
        @keyframes splashPulse {
          0% { left: -30%; width: 35%; }
          100% { left: 95%; width: 35%; }
        }
        @keyframes pulseGlow {
          0% { opacity: 0.6; transform: scale(0.95); }
          100% { opacity: 1; transform: scale(1.05); }
