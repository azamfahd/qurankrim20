<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Decorative Islamic Geometry Subtle Outline -->
  <circle cx="640" cy="360" r="320" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.15" />
  <circle cx="640" cy="360" r="260" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.1" stroke-dasharray="8 8" />

  <!-- App Card Preview Mockup Center -->
  <g transform="translate(640, 360)" filter="url(#shadow)">
    <!-- Central Glow -->
    <circle cx="0" cy="-60" r="140" fill="#d4af37" opacity="0.12" filter="blur(20px)" />
    
    <!-- Quran Book / Heart Icon Container -->
    <rect x="-90" y="-150" width="180" height="180" rx="44" fill="#043d2e" stroke="#d4af37" stroke-width="3" />
    
    <!-- Quran Calligraphic Motif Symbol -->
    <path d="M-40 -60 Q0 -85 40 -60 Q0 -35 -40 -60 Z M-40 -60 Q-20 -20 0 10 Q20 -20 40 -60" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="0" cy="-60" r="12" fill="#d4af37" />

    <!-- App Title Arabic -->
    <text x="0" y="80" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="46" font-weight="bold" fill="url(#goldGrad)">أنيس القلوب</text>
    
    <!-- App Subtitle -->
    <text x="0" y="125" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="22" font-weight="500" fill="#a7f3d0">رفيقك القرآني للتدبر والمواساة ومواقيت الصلاة</text>

    <!-- Badges -->
    <g transform="translate(-180, 165)">
      <rect width="110" height="34" rx="17" fill="#022c22" stroke="#059669" stroke-width="1.5" />
      <text x="55" y="23" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="14" fill="#6ee7b7">تلاوة وتدبر</text>
    </g>
    <g transform="translate(-55, 165)">
      <rect width="110" height="34" rx="17" fill="#022c22" stroke="#059669" stroke-width="1.5" />
      <text x="55" y="23" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="14" fill="#6ee7b7">مواقيت وأذان</text>
    </g>
    <g transform="translate(70, 165)">
      <rect width="110" height="34" rx="17" fill="#022c22" stroke="#059669" stroke-width="1.5" />
      <text x="55" y="23" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="14" fill="#6ee7b7">أذكار ومسبحة</text>
    </g>
  </g>
</svg>
