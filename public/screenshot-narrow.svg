<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960">
  <defs>
    <linearGradient id="bgGradNarrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGradNarrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Mobile Frame Background -->
  <rect width="540" height="960" fill="url(#bgGradNarrow)" />

  <!-- Top App Bar -->
  <rect x="0" y="0" width="540" height="90" fill="#022c22" />
  <text x="270" y="58" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="24" font-weight="bold" fill="url(#goldGradNarrow)">أنيس القلوب</text>

  <!-- Content Card 1: Daily Verse -->
  <rect x="30" y="120" width="480" height="240" rx="24" fill="#043d2e" stroke="#d4af37" stroke-width="1.5" />
  <text x="270" y="165" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="16" fill="#a7f3d0">آية اليوم وبلسم الفؤاد</text>
  <text x="270" y="220" text-anchor="middle" font-family="'Amiri', serif" font-size="22" fill="#fdfbf7">﴿ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ﴾</text>
  <text x="270" y="270" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="14" fill="#d4af37">سورة الرعد - الآية 28</text>

  <!-- Content Card 2: Next Prayer -->
  <rect x="30" y="385" width="480" height="190" rx="24" fill="#043d2e" stroke="#059669" stroke-width="1.5" />
  <text x="70" y="435" font-family="'Cairo', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#fdfbf7">الصلاة القادمة: صلاة العصر</text>
  <text x="70" y="475" font-family="'Cairo', system-ui, sans-serif" font-size="15" fill="#a7f3d0">متبقي على الأذان: 01:24:10</text>
  <rect x="70" y="505" width="140" height="38" rx="19" fill="#065f46" />
  <text x="140" y="530" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="14" fill="#fdfbf7">الأذان مفعل ✓</text>

  <!-- Content Card 3: Quick Navigation -->
  <rect x="30" y="600" width="225" height="150" rx="20" fill="#043d2e" />
  <text x="142" y="665" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#d4af37">المصحف الشريف</text>
  <text x="142" y="700" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="13" fill="#a7f3d0">قراءة وتلاوة واستماع</text>

  <rect x="285" y="600" width="225" height="150" rx="20" fill="#043d2e" />
  <text x="397" y="665" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="18" font-weight="bold" fill="#d4af37">الأذكار والمسبحة</text>
  <text x="397" y="700" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="13" fill="#a7f3d0">حصن المسلم والعداد</text>

  <!-- Bottom Navigation Bar -->
  <rect x="0" y="870" width="540" height="90" fill="#022c22" />
  <text x="90" y="920" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="14" fill="#a7f3d0">الرئيسية</text>
  <text x="225" y="920" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="14" fill="#a7f3d0">المصحف</text>
  <text x="360" y="920" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="14" fill="#d4af37">المواقيت</text>
  <text x="470" y="920" text-anchor="middle" font-family="'Cairo', system-ui, sans-serif" font-size="14" fill="#a7f3d0">الأذكار</text>
</svg>
