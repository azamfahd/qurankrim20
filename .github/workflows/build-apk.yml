name: Build Android APK Automatically

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Generate Capacitor Assets
        run: |
          mkdir -p assets
          cp public/icons/icon-512.png assets/icon.png
          cp public/icons/icon-512.png assets/icon-only.png
          cp public/icons/icon-512.png assets/icon-foreground.png
          cp public/icons/icon-512.png assets/splash.png
          cp public/icons/icon-512.png assets/splash-dark.png
          npx @capacitor/assets generate --android || true

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap init "أنيس القلوب" "com.anis.qulub" --web-dir dist || true
          npx cap add android || true
          npx @capacitor/assets generate --android || true
          npx cap sync android

      - name: Configure Android Permissions in AndroidManifest.xml
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            grep -q "ACCESS_FINE_LOCATION" "$MANIFEST_PATH" || sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.VIBRATE" />' "$MANIFEST_PATH"
            
            # Configure application flags for smooth offline SQLite and audio playback
            sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true" android:requestLegacyExternalStorage="true"/' "$MANIFEST_PATH" || true
            
            grep -q "android:scheme=\"com.anis.qulub\"" "$MANIFEST_PATH" || sed -i '/<activity/a \            <intent-filter android:autoVerify="true">\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="com.anis.qulub" android:host="auth" />\n            </intent-filter>' "$MANIFEST_PATH"
          fi

      - name: Copy raw sounds to Android
        run: |
          mkdir -p android/app/src/main/res/raw
          cp public/audio/adhan/*.mp3 android/app/src/main/res/raw/ || true

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy & Update Built APK to public/app-release.apk
        run: |
          mkdir -p public
          cp android/app/build/outputs/apk/debug/app-debug.apk public/app-release.apk
          
          # Update version timestamp in public/version.json
          TIMESTAMP=$(date +%s%3N)
          echo "{\"version\": \"1.1.0\", \"timestamp\": $TIMESTAMP, \"apkUpdated\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"}" > public/version.json

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnisAlQulub-Android-APK
          path: public/app-release.apk

      - name: Commit and Push Updated APK to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/app-release.apk public/version.json
          git diff --staged --quiet || git commit -m "chore(release): auto-update standalone android APK [skip ci]"
          git push origin HEAD:${{ github.ref }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
