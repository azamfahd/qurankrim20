name: Build Android APK Automatically

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Generate Capacitor Assets
        run: |
          mkdir -p assets
          cp public/icons/icon-512.png assets/icon.png
          cp public/icons/icon-512.png assets/icon-only.png
          cp public/icons/icon-512.png assets/icon-foreground.png
          cp public/icons/icon-512.png assets/splash.png
          cp public/icons/icon-512.png assets/splash-dark.png
          npx @capacitor/assets generate --android || true

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap init "أنيس القلوب" "com.anisalqulub.app" --web-dir dist || true
          npx cap add android || true
          npx @capacitor/assets generate --android || true
          npx cap sync android

      - name: Configure Android Project & AndroidManifest.xml
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/configure-android.cjs

      - name: Copy raw sounds to Android
        run: |
          mkdir -p android/app/src/main/res/raw
          cp public/audio/adhan/*.mp3 android/app/src/main/res/raw/ 2>/dev/null || true
          cp public/audio/adhkar/*.mp3 android/app/src/main/res/raw/ 2>/dev/null || true

      - name: Build Android APK (Signed Release & Debug)
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Copy & Update Built APK to public/app-release.apk
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p public
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk public/app-release.apk
            echo "✅ Successfully copied Signed Release APK to public/app-release.apk"
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk public/app-release.apk
            echo "⚠️ Copied Release Unsigned APK"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk public/app-release.apk
            echo "⚠️ Fallback to Debug APK"
          fi
          
          # Update version metadata with dynamic versionCode
          node generate-version.cjs

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnisAlQulub-Android-APK
          path: public/app-release.apk

      - name: Commit and Push Updated APK to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/app-release.apk public/version.json
          git diff --staged --quiet || git commit -m "chore(release): auto-update standalone android APK [skip ci]"
          git push origin HEAD:${{ github.ref }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
